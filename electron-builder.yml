appId: com.hormiga.finanzas
productName: Hormiga
copyright: Uso personal
directories:
  output: release
  buildResources: resources
# Only the compiled app goes into the package: no sources, tests, fixtures, .env or dev tooling.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/*.{ts,tsx,md,markdown}'
  - '!**/{test,tests,__tests__,docs,example,examples}/**'
  - '!**/.env*'
# Automatic updates: the installed app checks the public GitHub Releases of the download-only repository (no source code
# there). Releases up to 0.5.0 were published in «hormiga»; 1.0.0 is published in both so older installs update too.
publish:
  provider: github
  owner: davidescobar98
  repo: hormiga-app
  releaseType: release
asar: true
# Tray icon at runtime.
extraResources:
  - from: resources/icon.png
    to: icon.png
# pdf.js loads its worker module dynamically; keep it outside the archive for reliable ESM loading.
asarUnpack:
  - node_modules/pdfjs-dist/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
    # Single self-contained .exe, handy to share: no installation, each person keeps their own data.
    - target: portable
      arch: [x64]
  icon: resources/icon.png
nsis:
  artifactName: Hormiga-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hormiga
  # User data (%APPDATA%\Hormiga) is kept on uninstall unless the user deletes it from the app.
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  category: public.app-category.finance
linux:
  target: AppImage
  category: Finance
portable:
  artifactName: Hormiga-${version}-portable.${ext}
